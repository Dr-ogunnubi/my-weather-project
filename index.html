<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>my weather project</title>
  </head>
  <body>
    <div class="weather-app-container">
      <header>
        <form class="form-input">
          <input
            type="text"
            placeholder="Enter your city..."
            class="city-input"
            required
            autofocus
          />
          <input type="submit" value="search" class="city-submit" />
        </form>
      </header>
      <main>
        <h1>Paris</h1>
        <div class="main">
          <p class="weather-forecast">
            Saturday 15:42, overcast clouds
            <br />
            Humidity: <strong>74%</strong>, Wind: <strong>7.2km/h</strong>
          </p>
          <div class="weather-temperature">
            <div class="temperature-icon">⛅</div>
            <div class="temperature-value">13</div>
            <div class="temperature-unit">°C</div>
          </div>
        </div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/Dr-ogunnubi" target=" _blank"
          >Zainab Ogunnubi</a
        >, is
        <a
          href="https://github.com/Dr-ogunnubi/my-weather-project"
          target=" _blank"
          >open-sourced on GitHub</a
        >
        and
        <a
          href="https://my-first-complete-project.netlify.app/"
          target=" _blank"
          >hosted on Netlify</a
        >
      </footer>
    </div>
  </body>
</html>
